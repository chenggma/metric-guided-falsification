name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Core deps only: the unit tests exercise the env, metrics, fault
      # labeling, and calibration; RL training (stable-baselines3/torch) is
      # run locally and not needed here. pora-replication is not on PyPI,
      # so it is installed from git before resolving the package.
      - run: pip install "pora-replication @ git+https://github.com/chenggma/pora-replication"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
